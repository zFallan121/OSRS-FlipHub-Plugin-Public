# What an NPC charges to repair a broken item bought off the Grand Exchange, by the broken item's id.
#
# Only the fully broken state is tradeable, so a piece bought on the GE always pays the whole price.
# A player-owned house armour stand takes half a percent off per Smithing level, and does so for
# every item here: Barrows and Moons of Peril share that formula exactly. Nothing else belongs in
# this list. Torva is mended with Bandosian components, which the player ticks as a purchase, and
# the free repairs (armoured zombie gear, the Brimstone chest, the Giants' Foundry) cost no coins.
#
# Prices from the wiki's repair formulas, the same figures the website's repairables table carries.
# Ids checked against RuneLite's ItemID constants, 22 Sep 2026.

